<!doctype html>
<html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISP Box Card · personnalisation</title>
<style>
body{background:#101318;color:#e5e7eb;font:14px system-ui;margin:0;padding:20px}main{max-width:760px;margin:auto}h1{font-size:22px}p{line-height:1.6;color:#b3bac6}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:16px 0}label{display:grid;gap:6px}select,input,button{font:inherit;border:1px solid #586273;border-radius:6px;background:#202630;color:#fff;padding:8px}input[type=color]{width:80px;height:40px;padding:3px}input[type=number]{width:76px}button{cursor:pointer;min-height:40px}#status{font-size:12px}
</style>
<main><h1>Couleurs et formats personnalisables</h1><p>Démonstration avec données synthétiques : aucune box réelle, aucun appel de service. Le format compact conserve les mêmes informations et commandes, sans la grande illustration.</p>
<div class="controls"><label>Opérateur<select id="provider"><option value="free">Freebox</option><option value="orange">Livebox</option><option value="bouygues">Bbox</option><option value="sfr">SFR Box</option></select></label><label>Format<select id="layout"><option value="full">Complet</option><option value="compact">Compact</option></select></label></div>
<div class="controls" id="appearance-controls">
<label>Accent<input type="color" data-color="accent" value="#ed3346"></label><label>Fond<input type="color" data-color="background" value="#090a0b"></label><label>Texte<input type="color" data-color="text" value="#f5f5f5"></label>
<label>Arrondi (px)<input type="number" data-size="radius" min="0" max="40" placeholder="Auto"></label><label>Espacement (px)<input type="number" data-size="gap" min="0" max="24" placeholder="Auto"></label><label>Marge (px)<input type="number" data-size="padding" min="0" max="32" placeholder="Auto"></label>
<button type="button" id="reset">Réinitialiser</button></div><isp-box-card></isp-box-card><p id="status"></p></main>
<script type="module" src="./appearance-demo.js"></script></html>
